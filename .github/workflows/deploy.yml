name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'msu-content/content/events/**'
      - 'msu-content/content/notices/**'
      - 'msu-web/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit the rebuilt index.json
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Detect which paths changed ────────────────────────────────────────
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            content:
              - 'msu-content/content/events/**'
              - 'msu-content/content/notices/**'
              - 'scripts/**'
            web:
              - 'msu-web/**'
            workflow:
              - '.github/workflows/deploy.yml'

      # ── Phase 1: Rebuild content indexes ─────────────────────────────────
      # Runs only when events/notices .md files or the build script itself change.
      # .md files are fetched at runtime from GitHub, so no Vite rebuild is needed.
      - name: Set up Node.js for scripts
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install
        working-directory: scripts

      - name: Rebuild events & notices index.json
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/build-index.js

      - name: Commit updated indexes (if changed)
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add msu-content/content/events/index.json msu-content/content/notices/index.json
          git diff --cached --quiet || git commit -m "chore: rebuild content indexes [skip ci]"
          git push

      # ── Phase 2: Build the React app ─────────────────────────────────────
      # Runs only when msu-web/ source changes. Content-only pushes skip this
      # phase entirely since the app bundle is not affected by .md file changes.
      - name: Install web dependencies
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install
        working-directory: msu-web

      - name: Build Vite app
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build
        working-directory: msu-web
        env:
          # Defaults to /repo-name/ for GitHub Pages (https://<user>.github.io/<repo>/).
          # Can be overridden by setting repository variable VITE_BASE_URL (e.g. '/' for custom domain).
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '/msu-site/' }}

      # Copies index.html → 404.html so GitHub Pages serves the SPA correctly
      # for direct URL access and React Router deep links.
      - name: Copy index.html as 404.html for SPA routing
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        run: cp msu-web/dist/index.html msu-web/dist/404.html
      
      # ── Phase 3: Deploy to GitHub Pages ──────────────────────────────────
      - name: Setup Pages
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: msu-web/dist

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4

