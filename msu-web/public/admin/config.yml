# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# ─── Local development only ──────────────────────────────────────────────────
# Lets you edit files locally without GitHub auth.
local_backend: true

backend:
  name: github
  repo: ojambo04/msu-site
  branch: main

# Where uploaded images are stored in the repo
media_folder: /msu-content/images
# The repo-relative path written into markdown — matches the actual storage path
# so GitHub raw URLs can be constructed by simply prepending the raw base URL.
public_folder: /msu-content/images

# ─── Collections (Organized by Website Page) ────────────────────────────────

collections:

  # ==========================================================================
  # 1. HOME PAGE (/)
  # ==========================================================================
  - name: page_home
    label: "Home Page"
    files:
      - name: home
        label: "Home Page Content"
        file: msu-content/content/home.md
        fields:
          - name: hero
            label: "Hero Section"
            widget: object
            fields:
              - { name: badge, label: "Badge", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle / Motto", widget: string }
              - { name: description, label: "Description", widget: text }
              - name: primaryButton
                label: "Primary Button"
                widget: object
                fields:
                  - { name: text, label: "Button Text", widget: string }
                  - { name: link, label: "Link URL", widget: string }
              - name: secondaryButton
                label: "Secondary Button"
                widget: object
                fields:
                  - { name: text, label: "Button Text", widget: string }
                  - { name: link, label: "Link URL", widget: string }
          - name: secretariat
            label: "Central Secretariat"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: location, label: "Location", widget: string }
              - name: stats
                label: "Secretariat Numbers"
                widget: list
                fields:
                  - { name: value, label: "Number Value", widget: string }
                  - { name: label, label: "Label", widget: string }
          - name: features
            label: "Key Portal Features"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: link, label: "Target Route", widget: string }
          - name: stats
            label: "Key Union Statistics"
            widget: list
            fields:
              - { name: value, label: "Value", widget: string }
              - { name: label, label: "Label", widget: string }
          - name: socials
            label: "Social Media Banner"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }

  # ==========================================================================
  # 2. ABOUT & HISTORY PAGE (/about)
  # ==========================================================================
  - name: page_about
    label: "About & History"
    files:
      - name: about
        label: "About Union & Milestones"
        file: msu-content/content/about.md
        fields:
          - name: header
            label: "Header & Hero Banner"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false
              - name: constitutionPdf
                label: "Upload Constitution PDF"
                widget: file
                media_folder: /msu-content/files
                public_folder: /msu-content/files
                choose_url: true
                required: false
          - name: mission
            label: "Mission"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: content, label: "Content", widget: text }
          - name: vision
            label: "Vision"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: content, label: "Content", widget: text }
          - name: timeline
            label: "Union History Milestones"
            widget: list
            fields:
              - { name: year, label: "Year", widget: string }
              - { name: title, label: "Milestone Title", widget: string }
              - { name: description, label: "Description", widget: text }
          - name: body
            label: "Detailed About Writeup"
            widget: markdown

      - name: hallOfFame
        label: "Hall of Fame"
        file: msu-content/content/hallOfFame.md
        fields:
          - name: hallOfFame
            label: "Hall of Fame Lists"
            widget: object
            fields:
              - name: presidents
                label: "Former Presidents"
                widget: list
                fields:
                  - { name: name, label: "President Name", widget: string }
                  - { name: tenure, label: "Tenure Period (e.g. 1972 - 1978)", widget: string }
                  - { name: description, label: "Contributions / Achievements", widget: text }
                  - name: image
                    label: "Portrait Image"
                    widget: image
                    media_folder: /msu-content/images
                    public_folder: /msu-content/images
                    choose_url: true
                    required: false
              - name: secretaries
                label: "Former General Secretaries"
                widget: list
                fields:
                  - { name: name, label: "Secretary Name", widget: string }
                  - { name: tenure, label: "Tenure Period", widget: string }
                  - { name: description, label: "Contributions / Achievements", widget: text }
                  - name: image
                    label: "Portrait Image"
                    widget: image
                    media_folder: /msu-content/images
                    public_folder: /msu-content/images
                    choose_url: true
                    required: false

  # ==========================================================================
  # 3. LEADERSHIP PAGE (/leadership)
  # ==========================================================================
  - name: leadership
    label: "Leadership Directory"
    files:
      - name: executive
        label: "Executive Council & Office Bearers"
        file: msu-content/content/leadership.md
        fields:
          - name: header
            label: "Header & Hero Banner"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false
          - name: keyLeaders
            label: "Top Key Leaders (President & Gen. Secy)"
            widget: list
            fields:
              - { name: role, label: "Role / Designation", widget: string }
              - { name: name, label: "Full Name", widget: string }
              - { name: unit, label: "Unit / Office", widget: string }
              - { name: phone, label: "Contact Phone", widget: string, required: false }
              - { name: email, label: "Email Address", widget: string, required: false }
              - { name: message, label: "Official Message", widget: text, required: false }
              - name: image
                label: "Leader Photo"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false
          - name: officeBearers
            label: "Executive Council & Office Bearers"
            widget: list
            fields:
              - name: category
                label: "Category"
                widget: select
                options:
                  - "Administration"
                  - "Education"
                  - "Women Cell"
                  - "Information"
                  - "Cultural"
                  - "Finance"
                  - "Assembly"
              - { name: role, label: "Role / Designation", widget: string }
              - { name: name, label: "Full Name", widget: string }
              - { name: email, label: "Email", widget: string, required: false }
              - { name: phone, label: "Phone", widget: string, required: false }
              - name: image
                label: "Officer Photo"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false

      - name: constituentUnits
        label: "Constituent Units (27 Units)"
        file: msu-content/content/constituentUnits.md
        fields:
          - name: header
            label: "Header & Hero Banner"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string, required: false }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false
          - name: units
            label: "Constituent Units"
            widget: list
            summary: "{{fields.name}} ({{fields.zone}})"
            fields:
              - { name: name, label: "Unit Name", widget: string }
              - { name: zone, label: "Zone / Region (e.g. Manipur, Nagaland, National)", widget: string }
              - { name: location, label: "Town / City / Location", widget: string, required: false }
              - { name: email, label: "Unit Email Address", widget: string, required: false }
              - { name: president, label: "President Name", widget: string, required: false }
              - { name: presidentPhone, label: "President Phone Number", widget: string, required: false }
              - { name: secretary, label: "Secretary Name", widget: string, required: false }
              - { name: secretaryPhone, label: "Secretary Phone Number", widget: string, required: false }

      - name: subordinateBodies
        label: "Subordinate Bodies (4 Apex Bodies)"
        file: msu-content/content/subordinateBodies.md
        fields:
          - name: header
            label: "Header & Hero Banner"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string, required: false }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false
          - name: bodies
            label: "4 Subordinate Bodies"
            widget: list
            summary: "{{fields.name}} ({{fields.location}})"
            fields:
              - { name: name, label: "Body Name", widget: string }
              - { name: zone, label: "Zone / State (e.g. Manipur, Nagaland)", widget: string }
              - { name: location, label: "Town / City / Location", widget: string, required: false }
              - { name: description, label: "Description / Purpose", widget: text, required: false }
              - { name: email, label: "Email Address", widget: string, required: false }
              - { name: president, label: "President Name", widget: string, required: false }
              - { name: presidentPhone, label: "President Phone Number", widget: string, required: false }
              - { name: secretary, label: "Secretary Name", widget: string, required: false }
              - { name: secretaryPhone, label: "Secretary Phone Number", widget: string, required: false }

  # ==========================================================================
  # 4. NOTICE & PRESS RELEASES PAGE (/notices)
  # ==========================================================================
  - name: notices
    label: "Notice & Press Releases"
    label_singular: "Notice / Circular"
    folder: msu-content/content/notices
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: ref,         label: "Reference No. (e.g. MSU/PRESS/2026/08-01)", widget: string }
      - name: category
        label: "Category"
        widget: select
        options:
          - "Events & Tournaments"
          - "Official Circular"
          - "Press Release"
          - "Scholarship"
          - "General"
      - { name: urgent,      label: "Mark as Urgent",  widget: boolean, default: false }
      - { name: date,        label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: title,       label: "Title",           widget: string }
      - { name: snippet,     label: "Snippet (shown on listing card)", widget: text }
      - name: file
        label: "Upload Attachment / Document"
        widget: file
        media_folder: /msu-content/files
        public_folder: /msu-content/files
        choose_url: true
        required: false
      - name: body
        label: "Full Notice Body (Optional - triggers detail page)"
        widget: markdown
        required: false

  - name: notices_header
    label: "Notice Page: Banner & Header"
    files:
      - name: header
        label: "Notice & Press Page Banner"
        file: msu-content/content/notices.md
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string, required: false }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false

  # ==========================================================================
  # 5. EVENTS & PROGRAMS PAGE (/events)
  # ==========================================================================
  - name: events
    label: "Events & Programs"
    label_singular: "Event"
    folder: msu-content/content/events
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title,       label: "Title",           widget: string }
      - name: fromDate
        label: "From Date (Start Date)"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - name: toDate
        label: "To Date (End Date - optional for single-day events)"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false
      - name: status
        label: "Status (Auto-calculated from dates, or manual override)"
        widget: select
        required: false
        options:
          - { label: "Upcoming", value: upcoming }
          - { label: "Ongoing",  value: ongoing  }
          - { label: "Past",     value: past     }
      - { name: time,        label: "Time (optional)",  widget: string,   required: false }
      - { name: location,    label: "Location",         widget: string }
      - { name: snippet,     label: "Snippet (shown on card)", widget: text }
      - { name: youtubeId,   label: "YouTube Video ID (optional)",       widget: string,   required: false }
      - name: images
        label: "Gallery Images (optional)"
        widget: list
        required: false
        field:
          name: image
          label: Image
          widget: image
          choose_url: true
      - name: body
        label: "Full Event Writeup (Optional - triggers detail page)"
        widget: markdown
        required: false

  - name: events_header
    label: "Events Page: Banner & Header"
    files:
      - name: header
        label: "Events & Programs Page Banner"
        file: msu-content/content/events.md
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false

  # ==========================================================================
  # 6. STUDENTS' CORNER PAGE (/students)
  # ==========================================================================
  - name: students_corner
    label: "Students' Corner"
    files:
      - name: students
        label: "Header & Overview"
        file: msu-content/content/students.md
        fields:
          - name: header
            label: "Header & Hero Banner"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
              - name: bannerImage
                label: "Custom Banner Image (Optional)"
                widget: image
                media_folder: /msu-content/images
                public_folder: /msu-content/images
                choose_url: true
                required: false

      - name: scholarships
        label: "Scholarships Directory"
        file: msu-content/content/scholarships.md
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
          - name: scholarships
            label: "Scholarships"
            widget: list
            fields:
              - { name: title, label: "Scholarship Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: provider, label: "Provider / Agency", widget: string }
              - { name: deadline, label: "Application Deadline", widget: string }
              - { name: link, label: "Application Link", widget: string }

      - name: jobs
        label: "Job Vacancies"
        file: msu-content/content/jobs.md
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
          - name: jobs
            label: "Job Vacancies"
            widget: list
            fields:
              - { name: title, label: "Job Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: department, label: "Recruiting Department", widget: string }
              - { name: deadline, label: "Application Deadline", widget: string }
              - { name: link, label: "Portal Link", widget: string }

      - name: exams
        label: "Competitive Exams"
        file: msu-content/content/exams.md
        fields:
          - name: header
            label: "Header"
            widget: object
            fields:
              - { name: tag, label: "Tag / Category", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: subtitle, label: "Subtitle", widget: text }
          - name: exams
            label: "Exams & Entrance Tests"
            widget: list
            fields:
              - { name: title, label: "Exam Title", widget: string }
              - name: category
                label: "Exam Type"
                widget: select
                options: ["Competitive", "Entrance", "Academic"]
              - { name: description, label: "Description", widget: text }
              - { name: openingDate, label: "Opening Date", widget: string }
              - { name: closingDate, label: "Closing Date", widget: string }
              - { name: link, label: "Official Portal URL", widget: string }

  # ==========================================================================
  # 7. CONTACT & SECRETARIAT PAGE (/contact)
  # ==========================================================================
  - name: page_contact
    label: "Contact & Secretariat"
    files:
      - name: contact
        label: "Contact & Secretariat Details"
        file: msu-content/content/contact.md
        fields:
          - name: bannerImage
            label: "Custom Banner Image (Optional)"
            widget: image
            media_folder: /msu-content/images
            public_folder: /msu-content/images
            choose_url: true
            required: false
          - { name: location, label: "Location Summary", widget: string }
          - { name: helpline, label: "Helpline Phone", widget: string }
          - { name: address, label: "Full Physical Address", widget: text }
          - { name: email, label: "Contact Email", widget: string }
          - name: directory
            label: "Constituent Units Directory Info"
            widget: object
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }
          - name: socials
            label: "Social Media Links"
            widget: object
            fields:
              - { name: facebook, label: "Facebook Link", widget: string, required: false }
              - { name: instagram, label: "Instagram Link", widget: string, required: false }
              - { name: youtube, label: "YouTube Link", widget: string, required: false }
